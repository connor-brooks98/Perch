name: bird-feeder

# One compose project, all ARM64-friendly. The same file runs unchanged on the
# NUC if you ever migrate off the Pi.

# Cap per-container logs; the default json-file driver is unbounded and would
# eventually fill the Pi's disk during weeks of unattended INFO-level logging.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  puller:
    build:
      context: .
      dockerfile: puller/Dockerfile
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped
    init: true
    logging: *default-logging

  classifier:
    build:
      context: .
      dockerfile: classifier/Dockerfile
    env_file: .env
    volumes:
      - ./data:/data
      - ./classifier/model:/app/model:ro   # drop model.tflite + labels.txt here
    restart: unless-stopped
    init: true
    logging: *default-logging
    depends_on:
      - puller

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    init: true
    logging: *default-logging
    depends_on:
      - classifier

# Persistent state (creds, DB, clips, generated dashboard data) lives under
# ./data on the host — bind-mounted so it's trivial to back up. See scripts/.
